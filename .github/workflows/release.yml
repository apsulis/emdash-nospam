name: Release

# Stages the version on npm when a GitHub release is published, with provenance, through npm trusted
# publishing (OIDC: no npm token stored in GitHub). Nothing goes live until a maintainer approves it with 2FA
# (npmjs.com → package → Staged Packages → Approve, or `npm stage approve <stage-id>`): a compromised workflow
# cannot publish on its own.
# One-time setup on npmjs.com: package settings → Trusted publisher → GitHub Actions, organisation apsulis,
# repository emdash-nospam, workflow release.yml, environment npm, "allow npm publish" and "allow npm
# dist-tag" UNCHECKED (stage only).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # `npm stage` needs npm 11.15.0 or later; Node 24 ships an older npm.
      - run: npm install -g npm@11.19.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm stage publish --provenance --access public
